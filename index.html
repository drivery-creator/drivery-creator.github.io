<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drivery OS - Command Center</title>
    <style>
        :root {
            --bg-dark: #0a0c10;
            --cyan-glow: #00f3ff;
            --gray-border: rgba(255, 255, 255, 0.08);
            --glass-bg: rgba(15, 22, 32, 0.65);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-image: radial-gradient(circle at 50% 50%, #111a2e 0%, #0a0c10 100%);
        }

        /* Contenedor Principal Estilo Hollywood/Glassmorphism */
        .command-container {
            width: 420px;
            padding: 30px;
            background: var(--glass-bg);
            border: 1px solid var(--gray-border);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
            position: relative;
        }

        /* Encabezado e Indicador del Sistema */
        .brand {
            font-size: 0.8rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 25px;
        }

        /* --- PIEZA CENTRAL: EL ORBE --- */
        .orbe-wrapper {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto 30px auto;
            cursor: pointer;
        }

        .orbe {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, #001f3f 0%, #000b18 70%);
            border: 2px solid rgba(0, 243, 255, 0.2);
            position: relative;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.1);
            transition: all 0.5s ease;
        }

        .orbe-core {
            position: absolute;
            top: 25%;
            left: 25%;
            width: 50%;
            height: 50%;
            border-radius: 50%;
            background: radial-gradient(circle, var(--cyan-glow) 0%, rgba(0, 150, 255, 0.6) 60%, transparent 100%);
            box-shadow: 0 0 30px var(--cyan-glow);
            transition: all 0.3s ease;
        }

        /* Animación del Orbe en Escucha Pasiva (Glow) */
        @keyframes pulseGlow {
            0% { transform: scale(1); box-shadow: 0 0 30px var(--cyan-glow); }
            50% { transform: scale(1.15); box-shadow: 0 0 50px var(--cyan-glow), 0 0 70px rgba(0, 243, 255, 0.4); }
            100% { transform: scale(1); box-shadow: 0 0 30px var(--cyan-glow); }
        }

        .orbe-wrapper.listening .orbe-core {
            animation: pulseGlow 1.2s infinite ease-in-out;
        }

        .orbe-wrapper.listening .orbe {
            border-color: var(--cyan-glow);
        }

        /* Consola de Texto Informativa */
        .status-text {
            font-size: 1.1rem;
            font-weight: 300;
            margin-bottom: 15px;
            min-height: 28px;
            color: #e0e6ed;
        }

        .subtitle {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 25px;
        }

        /* --- FLOTA Y TARJETAS CINEMATOGRÁFICAS --- */
        .fleet-container {
            display: none;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
            text-align: left;
        }

        .fleet-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--gray-border);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .fleet-card:hover, .fleet-card.selected {
            background: rgba(0, 243, 255, 0.05);
            border-color: var(--cyan-glow);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.1);
        }

        .fleet-info h4 {
            font-size: 0.95rem;
            font-weight: 500;
            color: #ffffff;
        }

        .fleet-info p {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 2px;
        }

        .fleet-price {
            text-align: right;
        }

        .price-usd {
            font-size: 1rem;
            font-weight: 600;
            color: var(--cyan-glow);
        }

        .price-bs {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.4);
        }

        /* --- BOTÓN DE EJECUCIÓN INVISIBLE/MÍNIMO --- */
        .action-btn {
            display: none;
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #0088cc, #00f3ff);
            border: none;
            border-radius: 14px;
            color: #000;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 1px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 20px rgba(0, 243, 255, 0.3);
            transition: opacity 0.2s;
        }

        .action-btn:hover {
            opacity: 0.9;
        }

        /* --- TARJETA DE CONDUCTOR ENGANCHADO --- */
        .driver-card {
            display: none;
            background: rgba(0, 243, 255, 0.03);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
            text-align: left;
            animation: slideUp 0.4s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .driver-header {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .driver-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--cyan-glow);
        }

        .driver-details h5 {
            font-size: 1rem;
            font-weight: 600;
        }

        .driver-details p {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .plate-badge {
            display: inline-block;
            background: #fff;
            color: #000;
            font-weight: 700;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 4px;
            margin-top: 6px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="command-container">
        <div class="brand">Drivery OS Core</div>
        
        <div class="orbe-wrapper" id="orbeBtn">
            <div class="orbe">
                <div class="orbe-core"></div>
            </div>
        </div>

        <div class="status-text" id="statusMessage">Presione el Orbe para hablar</div>
        <div class="subtitle" id="subMessage">Orquestador de Movilidad Inteligente</div>

        <div class="fleet-container" id="fleetBox"></div>

        <div class="driver-card" id="driverBox">
            <div class="driver-header">
                <div class="driver-avatar" id="driverPhoto"></div>
                <div class="driver-details">
                    <h5 id="driverName">Buscando Conductor...</h5>
                    <p id="driverCar">Modelo del Vehículo</p>
                    <span class="plate-badge" id="driverPlate">------</span>
                </div>
            </div>
        </div>

        <button class="action-btn" id="confirmBtn">CONFIRMAR SOLICITUD</button>
    </div>

    <script>
        // CONFIGURACIÓN DE RUTAS DEL BACKEND (RENDER O LOCAL)
        const API_BASE = "http://localhost:10000/api"; 

        const orbeBtn = document.getElementById('orbeBtn');
        const statusMessage = document.getElementById('statusMessage');
        const fleetBox = document.getElementById('fleetBox');
        const confirmBtn = document.getElementById('confirmBtn');
        const driverBox = document.getElementById('driverBox');

        let userCoords = { lat: 10.4806, lng: -66.9036 }; // Ubicación Central Base (Modificable)
        let pollingInterval = null;

        // Inicialización del motor de voz nativo
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = 'es-VE';
            recognition.interimResults = false;

            orbeBtn.addEventListener('click', () => {
                orbeBtn.classList.add('listening');
                statusMessage.innerText = "Escuchando instrucción...";
                recognition.start();
            });

            recognition.onresult = async (event) => {
                orbeBtn.classList.remove('listening');
                const commandText = event.results[0][0].transcript;
                statusMessage.innerText = `"${commandText}"`;
                
                // Enviamos el comando de voz capturado al Servidor Core (Groq Agent)
                await enviarComando(commandText);
            };

            recognition.onerror = () => {
                orbeBtn.classList.remove('listening');
                statusMessage.innerText = "Error de captura de audio.";
            };
        } else {
            statusMessage.innerText = "Soporte de voz no disponible.";
        }

        // COMUNICACIÓN CON EL BACKEND AGENT
        async function enviarComando(texto) {
            try {
                const res = await fetch(`${API_BASE}/command`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ command: texto, userCoords })
                });

                const data = await res.json();
                
                if (data.display && data.display.fleet) {
                    renderFleet(data.display.fleet);
                } else if (data.reply) {
                    statusMessage.innerText = data.reply;
                }
            } catch (err) {
                console.error(err);
                statusMessage.innerText = "Falla de enlace con el Core.";
            }
        }

        // RENDERIZADO CINEMATOGRÁFICO DE LAS FLOTAS DISPONIBLES
        function renderFleet(fleet) {
            fleetBox.innerHTML = '';
            fleetBox.style.display = 'flex';
            confirmBtn.style.display = 'block';
            driverBox.style.display = 'none';

            fleet.forEach((car, index) => {
                const card = document.createElement('div');
                card.className = `fleet-card ${index === 0 ? 'selected' : ''}`;
                card.innerHTML = `
                    <div class="fleet-info">
                        <h4>${car.name}</h4>
                        <p>Llegada estimada: ${car.eta}</p>
                    </div>
                    <div class="fleet-price">
                        <div class="price-usd">$${car.usd}</div>
                        <div class="price-bs">${car.bs} Bs</div>
                    </div>
                `;
                card.onclick = () => {
                    document.querySelectorAll('.fleet-card').forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');
                };
                fleetBox.appendChild(card);
            });
        }

        // TRIGGER AL PRESIONAR EL BOTÓN FINAL (INICIA EL POLLING DE LA API INVERSA)
        confirmBtn.addEventListener('click', async () => {
            confirmBtn.style.display = 'none';
            fleetBox.style.display = 'none';
            driverBox.style.display = 'block';
            statusMessage.innerText = "Localizando unidad en canales remotos...";

            // Disparamos la orden inicial
            await fetch(`${API_BASE}/trip/request`, { method: 'POST' });

            // Activamos la escucha atómica (Polling) cada 2.5 segundos
            pollingInterval = setInterval(verificarEstatusViaje, 2500);
        });

        // POLLING AUTOMÁTICO AL SERVIDOR DE DRI VERY OS
        async function verificarEstatusViaje() {
            try {
                const res = await fetch(`${API_BASE}/trip/status`);
                const viaje = await res.json();

                if (viaje.status === "ASIGNADO" && viaje.conductor) {
                    // Detener el polling
                    clearInterval(pollingInterval);
                    
                    // Renderizar datos del conductor capturados por la API Inversa
                    statusMessage.innerText = "¡Unidad Confirmada y en Ruta!";
                    document.getElementById('driverName').innerText = viaje.conductor.nombre;
                    document.getElementById('driverCar').innerText = viaje.conductor.modelo;
                    document.getElementById('driverPlate').innerText = viaje.conductor.plate || viaje.conductor.placa;
                    
                    if (viaje.conductor.foto) {
                        document.getElementById('driverPhoto').style.backgroundImage = `url('${viaje.conductor.foto}')`;
                        document.getElementById('driverPhoto').style.backgroundSize = 'cover';
                    }
                }
            } catch (err) {
                console.error("Error en ciclo de polling:", err);
            }
        }
    </script>
</body>
</html>
