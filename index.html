<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drivery - Red de Rescate</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white font-sans flex flex-col justify-between min-h-screen p-4">

    <header class="text-center my-2">
        <h1 class="text-xl font-bold text-red-500 flex justify-center items-center gap-2">
            <span class="animate-ping inline-block w-3 h-3 rounded-full bg-red-500"></span>
            MODO EMERGENCIA: Drivery
        </h1>
        <p class="text-xs text-slate-400 mt-1">Tu ubicación está activa para geocercas de búsqueda</p>
    </header>

    <main class="flex-grow flex flex-col justify-center items-center">
        <div class="bg-slate-800 border-2 border-red-500 rounded-2xl p-4 w-full max-w-sm shadow-2xl">
            <div class="flex gap-4">
                <div class="w-24 h-24 bg-slate-700 rounded-xl overflow-hidden flex-shrink-0">
                    <img src="https://via.placeholder.com/150" alt="Desaparecido" class="w-full h-full object-cover">
                </div>
                <div>
                    <span class="bg-red-600 text-[10px] uppercase font-extrabold px-2 py-0.5 rounded">Buscar en esta zona</span>
                    <h2 class="text-lg font-bold mt-1">Carlos Mendoza</h2>
                    <p class="text-xs text-slate-300">**Edad:** 64 años</p>
                    <p class="text-xs text-slate-300">**Visto por última vez:** Av. San Martín</p>
                    <p class="text-xs text-amber-400 font-semibold mt-1">Camisa azul a cuadros, jean</p>
                </div>
            </div>
        </div>
    </main>

    <footer class="w-full max-w-sm mx-auto space-y-4 mb-4">
        
        <button onclick="reportarAvistamiento()" class="w-full bg-red-600 hover:bg-red-700 active:scale-95 transition text-white font-black py-5 rounded-2xl text-xl shadow-lg shadow-red-900/40 flex justify-center items-center gap-3">
            📍 ¡LO VI AQUÍ!
        </button>

        <div class="grid grid-cols-2 gap-3">
            <button onclick="document.getElementById('fotoInput').click()" class="bg-slate-800 hover:bg-slate-700 p-4 rounded-xl text-xs font-bold flex flex-col items-center gap-2 border border-slate-700">
                📷 Tomar Foto
                <input type="file" id="fotoInput" accept="image/*" capture="environment" class="hidden">
            </button>
            <button onclick="iniciarNotaVoz()" class="bg-slate-800 hover:bg-slate-700 p-4 rounded-xl text-xs font-bold flex flex-col items-center gap-2 border border-slate-700">
                🎙️ Reportar por Voz
            </button>
        </div>
    </footer>

    <script>
        // Función principal: Captura coordenadas exactas al tocar el botón
        function reportarAvistamiento() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const timestamp = new Date().toISOString();

                    const reporte = {
                        coordenadas: { lat, lon },
                        hora: timestamp,
                        id_desaparecido: "carlos_mendoza_123"
                    };

                    console.log("Reporte listo para enviar al backend/IA:", reporte);
                    alert(`¡Reporte enviado con éxito!\nCoordenadas capturadas: ${lat}, ${lon}`);
                    
                    // Aquí harías el fetch() a tu API de backend
                }, (error) => {
                    alert("Error al obtener la ubicación. Por favor, activa el GPS.");
                });
            } else {
                alert("Tu navegador no soporta geolocalización.");
            }
        }

        function iniciarNotaVoz() {
            alert("Grabando nota de voz de 5 segundos para procesar con IA...");
        }
    </script>
</body>
</html>
