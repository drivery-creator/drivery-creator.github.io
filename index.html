<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drivery OS - Mejorando para ti</title>
    <style>
        /* Estilos Base - Identidad Drivery OS */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000000; /* Fondo negro puro */
            color: #ffffff; /* Texto blanco */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Contenedor Principal Centrado */
        .maintenance-container {
            text-align: center;
            padding: 40px;
            max-width: 600px;
            width: 90%;
        }

        /* Estilo del Logo y Animación del Orbe */
        .logo {
            width: 150px; /* Ajusta según el tamaño de tu logo */
            height: auto;
            margin-bottom: 30px;
            /* Efecto sutil de respiración (pulso) */
            animation: pulseOrbe 3s infinite ease-in-out;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.3)); /* Resplandor suave */
        }

        /* Título Principal */
        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 15px;
            background: linear-gradient(180deg, #ffffff 0%, #a0a0a0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        /* Mensaje Secundario */
        p {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #cccccc; /* Gris suave para el texto */
            margin-bottom: 25px;
            font-weight: 300;
        }

        /* Subtexto de Agradecimiento */
        .thanks-msg {
            font-size: 1rem;
            color: #888888; /* Gris más oscuro */
            font-style: italic;
        }

        /* Definición de la animación de pulso */
        @keyframes pulseOrbe {
            0% {
                transform: scale(1);
                opacity: 0.9;
                filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.3));
            }
            50% {
                transform: scale(1.03); /* Crece ligeramente */
                opacity: 1;
                filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.5)); /* Brilla más */
            }
            100% {
                transform: scale(1);
                opacity: 0.9;
                filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.3));
            }
        }

        /* Ajustes para pantallas pequeñas */
        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            p { font-size: 1rem; }
            .logo { width: 120px; }
        }
    </style>
</head>
<body>
    <div class="maintenance-container">
        <img src="logo_app.png" alt="Drivery OS Logo" class="logo">
        
        <h1>Estamos expandiendo<br>nuestros servicios</h1>
        
        <p>Estamos trabajando en el Orbe para ofrecerte una experiencia de movilidad más inteligente y rápida.</p>
        
        <p class="thanks-msg">Gracias por confiar en nosotros.</p>
    </div>
</body>
</html>
