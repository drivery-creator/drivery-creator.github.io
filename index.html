<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drivery - Red de Rescate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-white font-sans flex flex-col justify-between min-h-screen p-4">

    <header class="text-center my-2">
        <h1 class="text-xl font-bold text-red-500 flex justify-center items-center gap-2">
            <span class="animate-ping inline-block w-3 h-3 rounded-full bg-red-500"></span>
            MODO EMERGENCIA: Drivery
        </h1>
        <p class="text-xs text-slate-400 mt-1">Tu ubicación está activa para geocercas de búsqueda</p>
    </header>

    <main class="flex-grow flex flex-col justify-center items-center">
        <div class="bg-slate-800 border-2 border-red-500 rounded-2xl p-4 w-full max-w-sm shadow-2xl">
            <div class="flex gap-4">
                <div class="w-24 h-24 bg-slate-700 rounded-xl overflow-hidden flex-shrink-0">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=200" alt="Persona Desaparecida" class="w-full h-full object-cover">
                </div>
                <div>
                    <span class="bg-red-600 text-[10px] uppercase font-extrabold px-2 py-0.5 rounded">Buscar en esta zona</span>
                    <h2 class="text-lg font-bold mt-1">Carlos Mendoza</h2>
                    <p class="text-xs text-slate-300">**Edad:** 64 años</p>
                    <p class="text-xs text-slate-300">**Última vez visto:** Av. San Martín</p>
                    <p class="text-xs text-amber-400 font-semibold mt-1">Camisa azul a cuadros, jean oscuro</p>
                </div>
            </div>
        </div>
    </main>

    <footer class="w-full max-w-sm mx-auto space-y-4 mb-4">
        
        <button onclick="reportarAvistamiento()" class="w-full bg-red-600 hover:bg-red-700 active:scale-95 transition text-white font-black py-5 rounded-2xl text-xl shadow-lg shadow-red-900/40 flex justify-center items-center gap-3">
            📍 ¡LO VI AQUÍ!
        </button>

        <div class="grid grid-cols-2 gap-3">
            <button onclick="document.getElementById('fotoInput').click()" class="bg-slate-800 hover:bg-slate-700 p-4 rounded-xl text-xs font-bold flex flex-col items-center gap-2 border border-slate-700 active:scale-95 transition">
                📷 Tomar Foto
                <input type="file" id="fotoInput" accept="image/*" capture="environment" class="hidden" onchange="subirFotoSimulada()">
            </button>
            <button onclick="iniciarNotaVoz()" class="bg-slate-800 hover:bg-slate-700 p-4 rounded-xl text-xs font-bold flex flex-col items-center gap-2 border border-slate-700 active:scale-95 transition">
                🎙️ Reportar por Voz
            </button>
        </div>
    </footer>

    <script>
        // Configuración con tus credenciales de Supabase
        const SUPABASE_URL = "https://koulxmmwcnkppxswxnxl.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_4rUGj7_gbn8Bqjlp-2UDgQ_AVn4fmH2";
        
        // Inicialización del cliente de Supabase
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 1. FUNCIÓN GPS: Captura coordenadas y guarda reporte base inmediato
        async function reportarAvistamiento() {
            if (!navigator.geolocation) {
                alert("Tu dispositivo no soporta geolocalización.");
                return;
            }

            navigator.geolocation.getCurrentPosition(async (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;

                try {
                    const { data, error } = await supabase
                        .from('reportes_avistamiento')
                        .insert([
                            { 
                                id_desaparecido: 'carlos_mendoza_123', 
                                latitud: lat, 
                                longitud: lon 
                            }
                        ]);

                    if (error) throw error;
                    alert(`¡Ubicación guardada en Supabase!\nLat: ${lat}\nLon: ${lon}`);
                    
                } catch (error) {
                    console.error("Error en Supabase:", error.message);
                    alert("No se pudo registrar la ubicación.");
                }
            }, (error) => {
                alert("Error al obtener GPS. Activa los permisos de ubicación.");
            }, { enableHighAccuracy: true, timeout: 10000 });
        }

        // 2. FUNCIÓN DE IA (Groq): Escucha la voz del conductor y procesa con la base de datos
        function iniciarNotaVoz() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                alert("Tu navegador no soporta reconocimiento de voz directo.");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'es-VE'; // Configurado para español de Venezuela
            recognition.interimResults = false;

            alert("🎙️ Red Drivery escuchando... Habla ahora claramente.");
            recognition.start();

            recognition.onresult = async function(event) {
                const textoEscuchado = event.results[0][0].transcript;
                alert(`Procesando reporte de voz: "${textoEscuchado}"\nEnviando a Groq...`);
                
                try {
                    // Llamamos a la función RPC de Postgres que creamos en Supabase
                    const { data, error } = await supabase
                        .rpc('procesar_reporte_con_groq', { texto_conductor: textoEscuchado });

                    if (error) throw error;

                    console.log("Análisis de la IA Groq:", data);
                    
                    // Mostramos el JSON estructurado devuelto por la IA
                    alert(`¡IA Procesada con éxito!\n\n👕 Ropa: ${data.ropa || 'No detectada'}\n🧠 Estado: ${data.estado || 'No detectado'}\n📍 Referencia: ${data.referencia || 'No detectada'}`);

                    // [OPCIONAL] Si además del análisis quieres guardar este texto con su GPS actual,
                    // aquí capturas el GPS e insertas en la tabla con las nuevas columnas: ia_ropa, ia_estado, ia_referencia.

                } catch (err) {
                    console.error("Error en el pipeline de IA:", err);
                    alert("Error: Verifica que guardaste la clave de Groq en el Vault de Supabase con el nombre 'GROQ_API_KEY'.");
                }
            };

            recognition.onerror = function(event) {
                alert("Error de micrófono: " + event.error);
            };
        }

        function subirFotoSimulada() {
            alert("Foto cargada. Lista para el pipeline de Computer Vision.");
        }
    </script>
</body>
</html>
