<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drivery - Red de Rescate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-white font-sans flex flex-col justify-between min-h-screen p-4">

    <!-- Encabezado de la App -->
    <header class="text-center my-2">
        <h1 class="text-xl font-bold text-red-500 flex justify-center items-center gap-2">
            <span class="animate-ping inline-block w-3 h-3 rounded-full bg-red-500"></span>
            MODO EMERGENCIA: Drivery
        </h1>
        <p class="text-xs text-slate-400 mt-1">Ubicación activa para geocercas en tiempo real</p>
    </header>

    <!-- Espacio Dinámico principal / Modal Formulario -->
    <main id="contenedor-pantalla" class="flex-grow flex flex-col justify-center items-center p-2 text-center">
        <!-- Tarjeta de Desaparecido por defecto (Carga inicial) -->
        <div id="contenedor-tarjeta" class="w-full max-w-sm bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl text-slate-400">
            <p class="text-sm">📍 Solicitando acceso al GPS e hilando cuadrantes...</p>
            <p class="text-xs mt-2 text-slate-500">Por favor, asegúrate de aceptar los permisos de ubicación si el navegador lo solicita.</p>
        </div>
    </main>

    <!-- Botonera de Acción Rápida para el Conductor -->
    <footer class="w-full max-w-sm mx-auto space-y-3 mb-4">
        <!-- BOTÓN: Encontré a Alguien (Verde Alerta) -->
        <button onclick="mostrarFormularioHallazgo()" class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-95 transition text-white font-black py-4 rounded-2xl text-lg shadow-lg shadow-emerald-900/40 flex justify-center items-center gap-2">
            🤝 ENCONTRÉ A ALGUIEN
        </button>

        <!-- Botón de Envío de Ubicación Pasiva -->
        <button onclick="reportarAvistamiento()" class="w-full bg-red-600 hover:bg-red-700 active:scale-95 transition text-white font-bold py-4 rounded-2xl text-base shadow-md flex justify-center items-center gap-2">
            📍 ¡LO VI AQUÍ!
        </button>

        <!-- Botones Multimedia e IA -->
        <div class="grid grid-cols-2 gap-3">
            <button onclick="document.getElementById('fotoInput').click()" class="bg-slate-800 hover:bg-slate-700 p-3 rounded-xl text-xs font-bold flex flex-col items-center gap-1 border border-slate-700 transition">
                📷 Tomar Foto
                <input type="file" id="fotoInput" accept="image/*" capture="environment" class="hidden" onchange="subirFotoConductor(this)">
            </button>
            <button onclick="iniciarNotaVoz()" class="bg-slate-800 hover:bg-slate-700 p-3 rounded-xl text-xs font-bold flex flex-col items-center gap-1 border border-slate-700 transition">
                🎙️ Reportar por Voz
            </button>
        </div>
    </footer>

    <script>
        // Configuración de Supabase
        const SUPABASE_URL = "https://koulxmmwcnkppxswxnxl.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_4rUGj7_gbn8Bqjlp-2UDgQ_AVn4fmH2";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Variables Globales
        window.idPersonaActualBusqueda = "caso_general_contingencia";
        let listaDesaparecidosBackend = [];
        let htmlTarjetaOriginal = "";

        // 1. CARGA INICIAL: Sincroniza datos extraídos por el scraper
        async function descargarCasosScraping() {
            try {
                const { data, error } = await supabase
                    .from('reportes_avistamiento')
                    .select('id_desaparecido, ia_referencia, latitud, longitud')
                    .like('id_desaparecido', 'vtb_%');

                if (!error && data) {
                    listaDesaparecidosBackend = data;
                    console.log("Casos del scraper sincronizados:", listaDesaparecidosBackend.length);
                }

                // RESPALDO DE SEGURIDAD VISUAL: Si la tabla está vacía en Supabase,
                // inyectamos un caso simulado para asegurar que la app sea funcional durante las pruebas de interfaz.
                if (listaDesaparecidosBackend.length === 0) {
                    listaDesaparecidosBackend = [{
                        id_desaparecido: 'vtb_simulado_1',
                        ia_referencia: 'Caso Sincronizado: Sistema de Prueba Drivery - Última zona vista: El Paraíso',
                        latitud: null,
                        longitud: null
                    }];
                }

                // Dibujar el estado de espera activo en la pantalla principal
                mostrarTarjetaDefault();

            } catch (err) { 
                console.error("Error al descargar casos de contingencia:", err); 
            }
        }

        function mostrarTarjetaDefault() {
            document.getElementById('contenedor-pantalla').innerHTML = `
                <div id="contenedor-tarjeta" class="w-full max-w-sm bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl text-slate-300">
                    <p class="text-sm font-bold text-amber-400 animate-pulse">📍 Buscando alertas en tu ruta...</p>
                    <p class="text-xs mt-2 text-slate-400">Casos activos cargados en el mapa del conductor: **${listaDesaparecidosBackend.length}**</p>
                    <button onclick="forzarSimulacionMatch()" class="mt-4 w-full bg-slate-700 hover:bg-slate-600 text-white text-xs py-2 rounded-xl font-bold transition">
                        Simular Entrada a Zona Activa
                    </button>
                </div>`;
        }

        // 2. CONFIGURACIÓN EXPLICITA DE GPS PARA PRODUCCIÓN MÓVIL
        const opcionesGPS = {
            enableHighAccuracy: true, // Obliga al smartphone a encender el chip de hardware GPS (mayor consumo, máxima precisión)
            timeout: 12000,           // Margen de 12 segundos para responder antes de declarar error de red/antena
            maximumAge: 0             // No recicla coordenadas cacheadas o viejas del navegador
        };

        if (navigator.geolocation) {
            // Ejecutar la descarga de datos desde Supabase
            descargarCasosScraping();

            // Seguimiento constante de coordenadas
            navigator.geolocation.watchPosition((position) => {
                const latConductor = position.coords.latitude;
                const lonConductor = position.coords.longitude;
                console.log(`GPS Track OK -> Lat: ${latConductor}, Lon: ${lonConductor}`);
                
                // Buscar si existe coincidencia espacial en el radio de acción
                const casoCercano = listaDesaparecidosBackend.find(caso => {
                    if (caso.latitud && caso.longitud) {
                        return Math.abs(caso.latitud - latConductor) < 0.015 && Math.abs(caso.longitud - lonConductor) < 0.015;
                    }
                    // Cuadrante geofence de contingencia manual (Caracas - El Paraíso)
                    if (caso.ia_referencia.includes("El Paraíso") && latConductor >= 10.4700 && latConductor <= 10.4900) return true;
                    return false;
                });

                // Si hay match geográfico y el formulario de hallazgos no está interrumpiendo, pintar la alerta
                if (casoCercano && !document.getElementById('form-hallazgo')) {
                    actualizarTarjetaInterfaz(casoCercano);
                }
            }, (err) => {
                console.error("Fallo crítico de geolocalización detectado. Código:", err.code, err.message);
                
                // Si el conductor rechaza los permisos o hay fallas de hardware, informar en pantalla con soluciones limpias
                document.getElementById('contenedor-pantalla').innerHTML = `
                    <div class="w-full max-w-sm bg-red-950/40 border border-red-500 rounded-2xl p-5 text-sm text-red-200">
                        ⚠️ **Error de Geolocalización (Código ${err.code}):** ${err.message}.<br>
                        <p class="text-xs mt-2 text-slate-400">Asegúrate de que tu celular tenga el GPS activo y que le hayas concedido permisos de ubicación a este navegador web en los ajustes del sistema.</p>
                    </div>`;
            }, opcionesGPS);
        } else {
            alert("Este navegador web móvil no soporta la API nativa de Geolocalización.");
        }

        // Renderizar dinámicamente la tarjeta del desaparecido asignado a la coordenada
        function actualizarTarjetaInterfaz(caso) {
            window.idPersonaActualBusqueda = caso.id_desaparecido;
            const infoLimpia = caso.ia_referencia.replace('Caso Sincronizado: ', '');
            const partes = infoLimpia.split(' - ');

            htmlTarjetaOriginal = `
                <div class="bg-slate-800 border-2 border-red-500 rounded-2xl p-4 w-full max-w-sm shadow-2xl animate-pulse">
                    <div class="flex gap-4 items-center">
                        <div class="w-20 h-20 bg-red-900/30 border border-red-500 rounded-xl flex items-center justify-center flex-shrink-0 text-2xl">👤</div>
                        <div class="text-left">
                            <span class="bg-red-600 text-[9px] uppercase font-extrabold px-2 py-0.5 rounded text-white">Alerta en tu cuadrante</span>
                            <h2 class="text-base font-bold mt-1 text-white">${partes[0]}</h2>
                            <p class="text-xs text-slate-300 mt-1">📍 ${partes[1] || 'Zona de riesgo'}</p>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('contenedor-pantalla').innerHTML = htmlTarjetaOriginal;
        }

        // Disparador manual para verificar flujos visuales instantáneamente
        function forzarSimulacionMatch() {
            if (listaDesaparecidosBackend.length > 0) {
                actualizarTarjetaInterfaz(listaDesaparecidosBackend[0]);
            }
        }

        // 3. MOSTRAR FORMULARIO DE HALLAZGO (CORREGIDO)
        function mostrarFormularioHallazgo() {
            document.getElementById('contenedor-pantalla').innerHTML = `
                <div id="form-hallazgo" class="w-full max-w-sm bg-slate-800 border-2 border-emerald-500 rounded-2xl p-5 shadow-2xl text-left text-sm">
                    <h3 class="text-base font-black text-emerald-400 mb-3 text-center">Formulario de Reskate Coincidente</h3>
                    
                    <label class="block text-xs text-slate-400 mb-1 font-bold">NOMBRE DE LA PERSONA AVISTADA</label>
                    <input type="text" id="inputNombreEncontrado" placeholder="Ej: Carlos Mendoza" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 mb-3 text-white focus:outline-none focus:border-emerald-500">
                    
                    <label class="block text-xs text-slate-400 mb-1 font-bold">CÉDULA / IDENTIFICACIÓN (OPCIONAL)</label>
                    <input type="text" id="inputCedulaEncontrado" placeholder="V-12345678" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 mb-4 text-white focus:outline-none focus:border-emerald-500">
                    
                    <div class="flex gap-2">
                        <button onclick="cancelarFormulario()" class="w-1/3 bg-slate-700 hover:bg-slate-600 py-2.5 rounded-xl font-bold text-xs transition">Cancelar</button>
                        <button onclick="procesarBusquedaConIA()" class="w-2/3 bg-emerald-600 hover:bg-emerald-700 py-2.5 rounded-xl font-black text-xs text-white transition flex justify-center items-center gap-1">🔍 Verificar con Groq</button>
                    </div>
                </div>
            `;
        }

        function cancelarFormulario() {
            if (htmlTarjetaOriginal) {
                document.getElementById('contenedor-pantalla').innerHTML = htmlTarjetaOriginal;
            } else {
                mostrarTarjetaDefault();
            }
        }

        // 4. VALIDACIÓN DE COINCIDENCIAS CRUZADAS CON IA (GROQ)
        async function procesarBusquedaConIA() {
            const nombre = document.getElementById('inputNombreEncontrado').value.trim();
            const cedula = document.getElementById('inputCedulaEncontrado').value.trim();

            if (!nombre) return alert("Por favor, ingresa al menos un nombre o descripción física.");

            alert("Cruzando datos... Groq está analizando el registro histórico del scraping en la base de datos.");

            try {
                const { data, error } = await supabase.rpc('buscar_desaparecido_con_groq', { nombre_buscado: nombre });
                if (error) throw error;

                console.log("Respuesta de validación de Groq:", data);

                // BLINDAJE DE RESPUESTA: Acepta variables idiomáticas devueltas por Groq (enfound / match / encontrado)
                if (data.encontrado === true || data.enfound === true || data.match === true) {
                    alert(`🚨 ¡MATCH CONFIRMADO POR LA IA!\n\n${data.mensaje}\n\nPresiona Aceptar para asociar la geolocalización actual de Drivery al reporte del caso.`);
                    window.idPersonaActualBusqueda = data.id_desaparecido;
                    
                    await reportarAvistamiento();
                    cancelarFormulario();
                } else {
                    alert(`ℹ️ No hay coincidencias directas en venezuelatebusca.com para: "${nombre}".\n\nAlmacenaremos los datos en la tabla general de avistamientos preventivos.`);
                    
                    navigator.geolocation.getCurrentPosition(async (pos) => {
                        await supabase.from('reportes_avistamiento').insert([{
                            id_desaparecido: 'hallazgo_nuevo_no_mapeado',
                            latitud: pos.coords.latitude,
                            longitud: pos.coords.longitude,
                            ia_referencia: `Persona hallada de forma independiente: ${nombre} - Identificación: ${cedula || 'N/D'}`
                        }]);
                        cancelarFormulario();
                    });
                }
            } catch (err) {
                console.error("Error en el pipeline de IA Groq:", err);
                alert("Ocurrió un error al procesar la solicitud con la Inteligencia Artificial.");
            }
        }

        // 5. REGISTRAR AVISTAMIENTO (BOTÓN ROJO)
        async function reportarAvistamiento() {
            return new Promise((resolve) => {
                navigator.geolocation.getCurrentPosition(async (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    try {
                        await supabase.from('reportes_avistamiento').insert([{ 
                            id_desaparecido: window.idPersonaActualBusqueda, 
                            latitud: lat, 
                            longitud: lon 
                        }]);
                        alert("¡Coordenadas e historial guardados con éxito en la base de datos central!");
                    } catch (error) { 
                        alert("Error al inyectar el pin en Supabase."); 
                    }
                    resolve();
                }, () => {
                    alert("No se pudo obtener la geolocalización exacta para fijar el reporte.");
                    resolve();
                }, opcionesGPS);
            });
        }

        // 6. MULTIMEDIA EN RUTA (FOTO Y NOTAS DE VOZ)
        function iniciarNotaVoz() {
            const SpeechRecognition = window.webkitSpeechRecognition || window.SpeechRecognition;
            if (!SpeechRecognition) return alert("Tu navegador móvil no tiene soporte activo para reconocimiento de voz (Speech API).");
            
            const recognition = new SpeechRecognition();
            recognition.lang = 'es-VE';
            alert("🎙️ Escuchando reporte en vivo... Habla con claridad.");
            recognition.start();
            
            recognition.onresult = async function(event) {
                const textoVoz = event.results[0][0].transcript;
                alert(`Audio transcrito: "${textoVoz}"\n\nEnviando a procesamiento sintáctico...`);
                try {
                    const { data } = await supabase.rpc('procesar_reporte_con_groq', { texto_conductor: textoVoz });
                    alert(`¡IA Procesó Voz!\n👕 Vestimenta identificada: ${data.ropa || 'N/D'}\n🧠 Estado de salud aparente: ${data.estado || 'N/D'}`);
                } catch (err) { 
                    alert("Error al deserializar o procesar la nota de voz."); 
                }
            };
        }

        async function subirFotoConductor(input) {
            if (!input.files || input.files.length === 0) return;
            const file = input.files[0];
            const nombreArchivo = `foto_driver_${Date.now()}.jpg`;
            
            alert("Subiendo evidencia visual resguardada al Storage...");
            
            try {
                await supabase.storage.from('fotos_avistamiento').upload(nombreArchivo, file);
                const { data: urlData } = supabase.storage.from('fotos_avistamiento').getPublicUrl(nombreArchivo);
                
                navigator.geolocation.getCurrentPosition(async (pos) => {
                    await supabase.from('reportes_avistamiento').insert([{
                        id_desaparecido: window.idPersonaActualBusqueda,
                        latitud: pos.coords.latitude,
                        longitud: pos.coords.longitude,
                        foto_url: urlData.publicUrl,
                        ia_referencia: "Evidencia fotográfica tomada por Conductor Drivery"
                    }]);
                    alert("¡Fotografía enlazada a las coordenadas geográficas con éxito!");
                }, null, opcionesGPS);
            } catch (err) { 
                alert("Fallo de red al intentar cargar el archivo al Storage."); 
            }
        }

        // 7. ESCUCHA REALTIME DE CAMBIOS (PUERTO DE ESCUCHA DEL SCRAPER)
        supabase.channel('cambios-scraper').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'reportes_avistamiento' }, payload => {
            if (payload.new.id_desaparecido && payload.new.id_desaparecido.startsWith('vtb_')) {
                listaDesaparecidosBackend.push(payload.new);
                console.log("Nuevo caso inyectado en tiempo real por el scraper:", payload.new);
            }
        }).subscribe();
    </script>
</body>
</html>
